<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Pulsing Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shield-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }

      @keyframes gridScan {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 100; }
      }

      @keyframes waveMotion {
        0% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0); }
      }

      .p1 { animation: floatParticle 6s ease-in-out infinite; }
      .p2 { animation: floatParticle 8s ease-in-out infinite 1s; }
      .p3 { animation: floatParticle 7s ease-in-out infinite 2.5s; }
      .glow-bg { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .grid-line { stroke: #334155; stroke-width: 1; stroke-dasharray: 6 6; animation: gridScan 12s linear infinite; }
      .wave { animation: waveMotion 10s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="glow-bg" cx="200" cy="100" r="180" fill="#4f46e5" opacity="0.25" filter="url(#glow)"/>
  <circle class="glow-bg" cx="1000" cy="300" r="220" fill="#9333ea" opacity="0.2" filter="url(#glow)"/>
  <circle class="glow-bg" cx="600" cy="200" r="150" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>

  <!-- Animated Tech Grid Lines -->
  <g opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="400" class="grid-line"/>
    <line x1="300" y1="0" x2="300" y2="400" class="grid-line"/>
    <line x1="500" y1="0" x2="500" y2="400" class="grid-line"/>
    <line x1="700" y1="0" x2="700" y2="400" class="grid-line"/>
    <line x1="900" y1="0" x2="900" y2="400" class="grid-line"/>
    <line x1="1100" y1="0" x2="1100" y2="400" class="grid-line"/>
    
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line"/>
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-line"/>
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line"/>
  </g>

  <!-- Floating Particles in Background -->
  <circle class="p1" cx="150" cy="280" r="4" fill="#38bdf8"/>
  <circle class="p2" cx="280" cy="80" r="6" fill="#818cf8"/>
  <circle class="p3" cx="950" cy="120" r="5" fill="#c084fc"/>
  <circle class="p1" cx="1050" cy="260" r="7" fill="#f472b6"/>
  <circle class="p2" cx="450" cy="340" r="4" fill="#34d399"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent-grad)" rx="3"/>

  <!-- Foreground Content Container -->
  <!-- Left Side: Shield / Governance Icon -->
  <g transform="translate(100, 115)" filter="url(#shield-glow)">
    <!-- Outer Shield Frame -->
    <path d="M 80 10 L 140 40 L 140 100 C 140 145 80 175 80 175 C 80 175 20 145 20 100 L 20 40 Z" 
          fill="#1e293b" stroke="url(#text-grad)" stroke-width="4" opacity="0.9"/>
    <!-- Inner Compliance Checkmark Shield -->
    <path d="M 80 25 L 125 48 L 125 95 C 125 130 80 155 80 155 C 80 155 35 130 35 95 L 35 48 Z" 
          fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <!-- Glowing Checkmark -->
    <path d="M 55 90 L 72 108 L 108 68" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Central Foreground Text -->
  <g transform="translate(280, 0)">
    <!-- Main Title -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" font-size="44" fill="url(#text-grad)" letter-spacing="0.5">
      Awesome AI Compliance Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="500" font-size="20" fill="#cbd5e1" letter-spacing="0.3">
      Curated Ecosystem for AI Governance, EU AI Act, NIST AI RMF &amp; Risk Audit
    </text>

    <!-- Feature Pills / Tags -->
    <g transform="translate(0, 255)">
      <!-- Pill 1: EU AI Act -->
      <rect x="0" y="0" width="130" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="65" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#60a5fa" text-anchor="middle">🇪🇺 EU AI Act</text>

      <!-- Pill 2: NIST AI RMF -->
      <rect x="142" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="212" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle">🏛️ NIST AI RMF</text>

      <!-- Pill 3: ISO 42001 -->
      <rect x="294" y="0" width="130" height="34" rx="17" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <text x="359" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#f472b6" text-anchor="middle">📜 ISO 42001</text>

      <!-- Pill 4: Open Source & SaaS -->
      <rect x="436" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="521" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">⚡ Open-Source &amp; SaaS</text>
    </g>
  </g>

  <!-- Bottom Decorative Border -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#accent-grad)" rx="3"/>
</svg>
