<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="shield-glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-25px) translateX(15px);opacity:.8}}@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes gridScan{0%{stroke-dashoffset:0}}@keyframes waveMotion{0%{transform:translateX(0)}50%{transform:translateX(-40px)}}.p1{animation:floatParticle 6s ease-in-out infinite}.p2{animation:floatParticle 8s ease-in-out infinite 1s}.p3{animation:floatParticle 7s ease-in-out infinite 2.5s}.glow-bg{animation:pulseGlow 5s ease-in-out infinite;transform-origin:center}.grid-line{stroke:#334155;stroke-width:1;stroke-dasharray:6 6;animation:gridScan 12s linear infinite}</style></defs><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><circle cx="200" cy="100" r="180" fill="#4f46e5" class="glow-bg" filter="url(#glow)" opacity=".25"/><circle cx="1000" cy="300" r="220" fi